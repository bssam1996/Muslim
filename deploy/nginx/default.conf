server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;

    # Flutter entrypoints and unversioned assets must revalidate on deployment.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing assets should return 404, not the Flutter HTML shell.
    location ~* \.(?:js|mjs|wasm|json|css|png|jpe?g|gif|svg|ico|webp|ttf|otf|woff2?|mp3|pdf|bin|map)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
